name: Automation Tests

on:
  push:
    branches: [main]

jobs:
  test:
    # store.laftel.net이 한국 외 지역 IP를 차단해(실측 확인, 2026-09-06) GitHub 호스팅
    # 러너(해외 데이터센터)에서는 사이트 접속 자체가 불가능하다. 한국 IP를 가진
    # self-hosted 러너(korea-macos-runner)를 사용한다(AUTOMATION_GUIDE 16.1절 참고).
    # 이 러너에는 이미 Python/Chrome이 설치되어 있으므로 setup-python/setup-chrome은
    # 사용하지 않는다.
    runs-on: [self-hosted, macOS, korea]
    env:
      CI: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: automation
        run: pip3 install -r requirements.txt

      - name: Run pytest
        id: pytest
        working-directory: automation
        continue-on-error: true
        env:
          SESSION_COOKIES_JSON: ${{ secrets.SESSION_COOKIES_JSON }}
        run: |
          mkdir -p reports
          python3 -m pytest --junitxml=reports/results.xml --html=reports/report.html

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            automation/reports/
            automation/screenshots/
          if-no-files-found: ignore

      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash automation/scripts/notify-ci-slack.sh automation/reports/results.xml

      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1
